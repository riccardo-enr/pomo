[package]
name = "pomo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
etcetera = "0.11.0"
humantime = "2.3.0"
notify-rust = "4.17.0"
ratatui = "0.30.0"
rodio = { version = "0.22.2", default-features = false, features = ["wav", "playback"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
